name: CricCoachAI
options:
  bundleIdPrefix: com.criccoach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CricCoachAI:
    type: application
    platform: iOS
    sources:
      - path: CricCoachAI
    resources:
      - path: CricCoachAI/Resources
    settings:
      base:
        INFOPLIST_FILE: CricCoachAI/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.criccoach.ai
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: CricCoachAI/CricCoachAI.entitlements
  CricCoachAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CricCoachAITests
    dependencies:
      - target: CricCoachAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.criccoach.ai.tests
